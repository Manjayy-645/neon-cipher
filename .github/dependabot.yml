version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/web
      - /packages/game-rules
      - /packages/tokens
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
